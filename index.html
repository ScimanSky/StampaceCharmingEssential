<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stampace Charming Essential</title>
    <meta
      name="description"
      content="Guest app elegante, essenziale e mobile-first per strutture ricettive."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <span class="topbar-mark" aria-hidden="true"></span>
        <div class="topbar-copy">
          <strong class="topbar-name" id="app-name"></strong>
        </div>
      </header>

      <section class="hero-block" aria-hidden="true"></section>

      <section class="hero-caption">
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-meta">
          <span id="footer-address"></span>
          <span id="footer-license"></span>
        </div>
      </section>

      <main class="main-menu" id="main-menu"></main>
    </div>

    <div class="section-sheet hidden" id="section-sheet" aria-hidden="true">
      <button class="sheet-backdrop" id="sheet-backdrop" type="button" aria-label="Close"></button>
      <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <header class="sheet-header">
          <div class="sheet-icon" id="sheet-icon" aria-hidden="true"></div>
          <div class="sheet-title-block">
            <p class="sheet-brand" id="sheet-brand"></p>
            <h2 id="sheet-title"></h2>
            <p class="sheet-lead" id="sheet-lead"></p>
          </div>
          <button class="sheet-close" id="sheet-close" type="button" aria-label="Close section">
            <span aria-hidden="true">×</span>
          </button>
        </header>
        <div class="sheet-content" id="sheet-content"></div>
      </section>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
