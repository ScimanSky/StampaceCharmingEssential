<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stampace Charming Essential</title>
    <meta
      name="description"
      content="Guest app elegante, essenziale e mobile-first per strutture ricettive."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <span class="topbar-mark" aria-hidden="true"></span>
        <div class="topbar-copy">
          <strong class="topbar-name" id="app-name"></strong>
        </div>
      </header>

      <section class="hero-block" aria-hidden="true"></section>

      <section class="hero-caption">
        <p class="hero-subtitle" id="hero-subtitle"></p>
        <div class="hero-meta">
          <span id="footer-address"></span>
          <span id="footer-license"></span>
        </div>
      </section>

      <main class="main-menu" id="main-menu"></main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
