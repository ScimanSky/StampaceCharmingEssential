<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stampace Charming Host</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./host.css?v=20260524c" />
  </head>
  <body>
    <main class="host-shell">
      <p class="host-status" id="host-status"></p>

      <section class="host-gate" id="host-gate">
        <p class="host-kicker">Stampace Charming</p>
        <h1>Accesso host</h1>
        <p class="host-copy">
          Questa pagina usa Supabase per aggiornare il template live dell'app ospiti. L'accesso è
          consentito tramite password host.
        </p>
        <div class="host-gate-form">
          <label>
            <span>Email autorizzata</span>
            <input id="host-email" type="email" readonly />
          </label>
          <label>
            <span>Password host</span>
            <input id="host-password" type="password" autocomplete="current-password" />
          </label>
          <button id="host-login" type="button">Accedi</button>
        </div>
      </section>

      <section class="host-app hidden" id="host-app">
        <header class="host-header">
          <div>
            <p class="host-kicker">Stampace Charming</p>
            <h1>Editor template</h1>
          </div>
          <div class="host-actions">
            <button class="ghost-button" id="host-logout" type="button">Esci</button>
            <button class="ghost-button" id="host-reset" type="button">Ripristina default</button>
            <button class="ghost-button" id="host-export" type="button">Esporta JSON</button>
            <label class="ghost-button file-button">
              <span>Importa JSON</span>
              <input id="host-import" type="file" accept="application/json" />
            </label>
            <button class="ghost-button" id="host-save" type="button">Salva bozza locale</button>
            <button id="host-publish" type="button">Pubblica ora</button>
          </div>
        </header>

        <section class="host-card">
          <h2>Dati generali</h2>
          <div class="host-grid">
            <label>
              <span>Nome struttura</span>
              <input id="field-app-name" type="text" />
            </label>
            <label>
              <span>Sottotitolo</span>
              <input id="field-subtitle" type="text" />
            </label>
            <label class="host-grid-wide">
              <span>Indirizzo</span>
              <input id="field-address" type="text" />
            </label>
            <label class="host-grid-wide">
              <span>CIN</span>
              <input id="field-license" type="text" />
            </label>
          </div>
        </section>

        <section class="host-sections" id="host-sections"></section>
      </section>
    </main>

    <script type="module" src="./host.js?v=20260524c"></script>
  </body>
</html>
